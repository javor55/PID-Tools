# Lint rules checked locally and in CI (.github/workflows/tests.yml). Explicit so that a newer ruff
# release with different defaults gives the same result.
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "B", "C901"]
# B905 (zip bez strict=) – v kódu se záměrně zipují různě dlouhé řady
ignore = ["B905"]

# C901: hranice složitosti funkce – dlouhé render funkce záložek se dělí na kroky (viz pages/model.py, tuning.py);
# nejsložitější dnes jsou výpočetní funkce jádra (fit_model, fit_windows, optimize_time) kolem 29
[lint.mccabe]
max-complexity = 30
