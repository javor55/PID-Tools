# PID Tools – veřejná instance za Cloudflare Tunnelem (návod: deploy/README.md). Spuštění: docker compose up -d
# Aktualizace obrazu: systemd časovač z install-update-timer.sh (docker compose pull + up -d každých 5 minut).
name: pidtools

services:
  app:
    image: ${PIDTOOLS_IMAGE:-ghcr.io/javor55/pid-tools:deploy}
    env_file: .env
    # žádné publikované porty – dovnitř se jde jen přes cloudflared (síť compose)
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: ${APP_MEM_LIMIT:-6g}
    cpus: ${APP_CPUS:-3}
    pids_limit: ${APP_PIDS_LIMIT:-512}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?doplňte TUNNEL_TOKEN do .env}
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
