# Tests and lint on every push and pull request (web, application layer, desktop without a display).
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: System libraries for Qt (offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: pip install -r requirements.txt -r requirements-desktop.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Browser for the UI test (Chromium)
        run: python -m playwright install --with-deps chromium

      - name: Lint
        run: ruff check .

      # nové rozhraní (frontend/, React + TS): typy z openapi.json, lint, typy, testy, sestavení → pidtools/api/ui
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npx -y npm@11.21.0 ci --no-audit --no-fund

      - name: Frontend API types match openapi.json
        working-directory: frontend
        run: npm run api-types && git diff --exit-code src/api/schema.d.ts

      - name: Frontend lint, types, tests, build
        working-directory: frontend
        run: npm run lint && npm run typecheck && npm test && npm run build

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
