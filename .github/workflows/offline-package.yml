# Windows (x64) packages, built and tested on windows-latest and uploaded as artifacts; on a version tag (v*) they
# are also attached to a GitHub release:
#   - desktop: "PID Tools.exe" as an installer (PID-Tools-<v>-setup.exe) and a portable ZIP (tools/build_desktop.py)
#   - web: offline package with an embedded Python, started by PID-Tools.bat (tools/build_offline.py)
name: Offline package (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths:
      - "tools/build_offline.py"
      - "tools/build_desktop.py"
      - "tools/smoke_test.py"
      - ".github/workflows/offline-package.yml"
      - "requirements.txt"
      - "requirements-desktop.txt"

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt -r requirements-desktop.txt pyinstaller

      - name: Build exe, installer and portable ZIP
        run: python tools/build_desktop.py

      - name: Test the built application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PID Tools\PID Tools.exe" -ArgumentList "--smoke" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Smoke test failed ($($p.ExitCode))" }
          Write-Host "Desktop smoke test: ok"

      - name: Check the installer
        shell: pwsh
        run: if (-not (Test-Path dist\PID-Tools-*-setup.exe)) { throw "Installer missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: PID-Tools-desktop-win64
          path: |
            dist/PID-Tools-*-setup.exe
            dist/PID-Tools-*-desktop-win64-portable.zip
          compression-level: 0
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "PID Tools $GITHUB_REF_NAME" \
              --notes "Windows (x64): PID-Tools-*-setup.exe installs the desktop application (no admin rights); the portable ZIP runs without installation; the web offline ZIP runs the web app in the browser (PID-Tools.bat). See docs/deployment.md." || true
          gh release upload "$GITHUB_REF_NAME" dist/PID-Tools-*-setup.exe dist/PID-Tools-*-desktop-win64-portable.zip --clobber

  web:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build package
        run: python tools/build_offline.py

      - name: Test with the embedded Python
        working-directory: dist/PID-Tools-web/app
        run: ..\python\python.exe ..\..\..\tools\smoke_test.py

      - name: Start the server and check health
        shell: pwsh
        run: |
          $pkg = Resolve-Path "dist\PID-Tools-web"
          $p = Start-Process -FilePath "$pkg\python\python.exe" -WorkingDirectory "$pkg\app" -PassThru `
               -ArgumentList "-m", "streamlit", "run", "app.py", "--server.headless", "true", "--server.port", "8599"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest -UseBasicParsing http://localhost:8599/_stcore/health).Content -eq "ok") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "The app did not start" }
          Write-Host "Server health: ok"

      - uses: actions/upload-artifact@v4
        with:
          name: PID-Tools-web-win64-offline
          path: dist/PID-Tools-*-web-win64-offline.zip
          compression-level: 0
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "PID Tools $GITHUB_REF_NAME" \
              --notes "Windows (x64): PID-Tools-*-setup.exe installs the desktop application (no admin rights); the portable ZIP runs without installation; the web offline ZIP runs the web app in the browser (PID-Tools.bat). See docs/deployment.md." || true
          gh release upload "$GITHUB_REF_NAME" dist/PID-Tools-*-web-win64-offline.zip --clobber
