# Multi-arch (amd64 + arm64) web image to GHCR on every push to the `deploy` branch (docs: deploy/README.md).
name: Web image

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/javor55/pid-tools

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=deploy
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=PID Tools web
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}

      # the amd64 image is built, smoke-tested and scanned BEFORE anything is pushed
      - name: Build amd64 image (local, for the smoke test and the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          load: true
          tags: pid-tools-web:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-amd64
          cache-to: type=gha,mode=max,scope=web-amd64

      - name: Smoke test (token mode, read-only filesystem)
        run: |
          docker run -d --name smoke -p 8080:8080 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e PIDTOOLS_AUTH=token -e PIDTOOLS_TOKEN=smoke-token pid-tools-web:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          code=$(curl -s -o "$RUNNER_TEMP/ws.json" -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer smoke-token' http://127.0.0.1:8080/api/v1/workspaces)
          echo "POST /api/v1/workspaces -> $code"; cat "$RUNNER_TEMP/ws.json"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then docker logs smoke; exit 1; fi
          curl -fsS http://127.0.0.1:8080/ -o /dev/null
          docker rm -f smoke

      - name: Trivy scan (fails on CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: pid-tools-web:smoke
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web-multi
          cache-to: type=gha,mode=max,scope=web-multi
