# Typová kontrola: jen pidtools/api a pidtools/app/workspace (TICKET-018); ostatní balíčky jsou importovatelné bez hlášení.
[mypy]
python_version = 3.11
check_untyped_defs = True
warn_unused_ignores = True
ignore_missing_imports = True

[mypy-pidtools.*]
ignore_errors = True

[mypy-pidtools.api.*]
ignore_errors = False

[mypy-pidtools.app.workspace.*]
ignore_errors = False
