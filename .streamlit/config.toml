# Colour themes. The user chooses light / dark / system in the ⋮ menu → Settings.
[theme]
# IBM Plex (Google Fonts); without internet the browser falls back to its sans-serif font
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "medium"
# desktop only (large displays, mouse): smaller base font = denser layout, finer fields
baseFontSize = 13

[theme.light]
primaryColor = "#1f5fa8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1f2933"
borderColor = "#e5e7eb"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"

[browser]
# no Streamlit telemetry (the app is used with plant data)
gatherUsageStats = false

[client]
# users see only the app, not developer options (Deploy, Rerun …)
toolbarMode = "viewer"

[server]
# largest uploaded file [MB] – historian exports can be large
maxUploadSize = 200
