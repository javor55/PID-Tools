# Barevná schémata aplikace. Uživatel volí světlé / tmavé / podle systému v menu ⋮ → Settings.
[theme.light]
primaryColor = "#1f5fa8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1f2933"
borderColor = "#e5e7eb"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"

[browser]
# žádná telemetrie Streamlitu (aplikace se používá s provozními daty)
gatherUsageStats = false

[client]
# uživatelé vidí jen aplikaci, ne vývojářské volby (Deploy, Rerun …)
toolbarMode = "viewer"

[server]
# největší nahrávaný soubor [MB] – exporty z historianu bývají velké
maxUploadSize = 200
