# Colour themes. The user chooses light / dark / system in the ⋮ menu → Settings.
[theme]
# IBM Plex bundled with the app (static/fonts, SIL Open Font License) – no request leaves the server, works offline
font = "IBM Plex Sans"
codeFont = "IBM Plex Mono"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "medium"
# desktop only (large displays, mouse): smaller base font = denser layout, finer fields
baseFontSize = 12

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/ibm-plex-sans-latin-400-normal.woff2"
weight = 400
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

