[theme.light]
primaryColor = "#1f5fa8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f8"
textColor = "#1f2933"
borderColor = "#e5e7eb"

[theme.dark]
primaryColor = "#60a5fa"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#e2e8f0"
borderColor = "#334155"

[browser]
# no Streamlit telemetry (the app is used with plant data)
gatherUsageStats = false

[client]
# users see only the app, not developer options (Deploy, Rerun …)
toolbarMode = "viewer"

[server]
# static/ next to app.py is served at app/static/ (bundled fonts)
enableStaticServing = true
# largest uploaded file [MB] – historian exports can be large; a parsed table takes several times the file size in
# memory (shared server: keep it moderate)
maxUploadSize = 100
